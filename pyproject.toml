[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens"
version = "0.1.0"
description = "Explainable brain MRI image classification and model evaluation platform for ML research and education (not a medical device)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "NeuroLens contributors" }]
# Core ML stack. Ranges are constrained to major versions known to work together;
# CI resolves the newest compatible versions inside these bounds.
dependencies = [
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pillow>=10.2,<14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.6,<3",
]
app = [
    "streamlit>=1.36,<2",
    "plotly>=5.20,<7",
    "httpx>=0.27,<1",
]
onnx = [
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
    "onnxscript>=0.1; python_version >= '3.10'",
]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.5,<1",
    "httpx>=0.27,<1",
]
all = ["neurolens[api,app,onnx,dev]"]

[project.scripts]
neurolens = "neurolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "slow: tests that train a model for a few steps (still CPU-friendly)",
    "onnx: tests requiring onnx and onnxruntime",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.onnx.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "N812",   # `import torch.nn.functional as F` is idiomatic PyTorch
    "RUF001", # allow unicode in UI strings
    "RUF002",
    "RUF003",
    "B008",   # FastAPI's File(...)/Depends(...) defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
# Streamlit page scripts: long hover templates and UI copy read better unwrapped.
"app/views/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["neurolens", "api", "app", "ui", "backend"]
