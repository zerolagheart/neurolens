# Same model as resnet18.yaml, trained and evaluated on the leakage-audited benchmark.
# Requires: neurolens audit --data-root data/raw/brain-tumor-mri-dataset
# Results on this benchmark are NOT comparable with results on the original split.
experiment_name: resnet18_leakage_audited
seed: 42

data:
  root: data/raw/brain-tumor-mri-dataset
  benchmark: leakage_audited
  val_fraction: 0.15
  audit_dir: artifacts/audit
  num_workers: 4

model:
  architecture: resnet18
  pretrained: true
  dropout: 0.2

training:
  epochs: 12
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  monitor: val_macro_f1
  early_stopping_patience: 4
  device: auto
