# EfficientNet-B0 fine-tuned from ImageNet weights.
experiment_name: efficientnet_b0_baseline
seed: 42

data:
  root: data/raw/brain-tumor-mri-dataset
  benchmark: original
  val_fraction: 0.15
  num_workers: 4

preprocessing:
  image_size: 224

model:
  architecture: efficientnet_b0
  pretrained: true
  dropout: 0.2

training:
  epochs: 12
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.0001
  scheduler: cosine
  monitor: val_macro_f1
  early_stopping_patience: 4
  amp: true
  device: auto
