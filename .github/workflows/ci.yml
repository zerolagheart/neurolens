name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3" "torchvision>=0.17,<1"

      - name: Install project
        run: pip install -e ".[all]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      # No dataset, Kaggle credentials, GPU or trained weights are needed: tests build tiny
      # synthetic images and an untrained test checkpoint in temporary directories.
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t neurolens:ci .
      - name: Smoke test /health (no model mounted -> ready=false)
        run: |
          docker run -d --name nl -p 8000:8000 neurolens:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -s http://localhost:8000/health | python -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='ok' and b['ready'] is False, b"
          docker rm -f nl
